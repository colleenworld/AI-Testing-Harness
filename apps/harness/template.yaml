AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Secure Production Evaluation Harness Engine Infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  ProjectName:
    Type: String
    Default: evaluation

  FrontendOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Frontend origin allowed to access the API

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues:
      - 3
      - 7
      - 30

  PipeSchedule:
    Type: String
    Default: cron(0 2 * * ? *)
    Description: EventBridge schedule for evaluation runs

  ApiSecretKeyArn:
    Type: String

Resources:
  NetworkStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./stacks/network.yaml
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName

  DatabaseStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./stacks/database.yaml
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        RdsSecurityGroupId:
          !GetAtt NetworkStack.Outputs.RdsSecurityGroupId
        PrivateSubnetIds:
          !GetAtt NetworkStack.Outputs.PrivateSubnetIds

  LambdaStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./stacks/lambda.yaml
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName

        Schedule: !Ref PipeSchedule
        LambdaSecurityGroupId:
          !GetAtt NetworkStack.Outputs.LambdaSecurityGroupId

        PrivateSubnetIds:
          !GetAtt NetworkStack.Outputs.PrivateSubnetIds

        DatabaseEndpoint:
          !GetAtt DatabaseStack.Outputs.DatabaseEndpoint

        DatabasePort:
          !GetAtt DatabaseStack.Outputs.DatabasePort

        DatabaseName:
          !GetAtt DatabaseStack.Outputs.DatabaseName

        DatabaseSecretArn:
          !GetAtt DatabaseStack.Outputs.DatabaseSecretArn

        ApiSecretKeyArn:
          !Ref ApiSecretKeyArn

        LogRetentionDays: !Ref LogRetentionDays

  ApiStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./stacks/api.yaml
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        FrontendOrigin: !Ref FrontendOrigin

        LambdaExecutionRole:
          !GetAtt LambdaStack.Outputs.LambdaExecutionRoleArn

        LambdaSecurityGroupId:
          !GetAtt NetworkStack.Outputs.LambdaSecurityGroupId

        PrivateSubnetIds:
          !GetAtt NetworkStack.Outputs.PrivateSubnetIds

        DatabaseEndpoint:
          !GetAtt DatabaseStack.Outputs.DatabaseEndpoint

        DatabasePort:
          !GetAtt DatabaseStack.Outputs.DatabasePort

        DatabaseName:
          !GetAtt DatabaseStack.Outputs.DatabaseName

        DatabaseSecretArn:
          !GetAtt DatabaseStack.Outputs.DatabaseSecretArn

        LogRetentionDays: !Ref LogRetentionDays

Outputs:
  ApiEndpointUrl:
    Description: Secured API Gateway endpoint
    Value: !GetAtt ApiStack.Outputs.ApiGatewayUrl

  VpcId:
    Description: Evaluation Harness VPC ID
    Value: !GetAtt NetworkStack.Outputs.VpcId

  DatabaseEndpoint:
    Description: Evaluation database endpoint
    Value: !GetAtt DatabaseStack.Outputs.DatabaseEndpoint

  HydrateLambdaArn:
    Description: Hydrate Lambda ARN
    Value: !GetAtt LambdaStack.Outputs.HydrateLambdaArn

  PipeLambdaArn:
    Description: Pipe Lambda ARN
    Value: !GetAtt LambdaStack.Outputs.PipeLambdaArn
