AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Judge Lambda for the Evaluation Harness

Parameters:
  ProjectName:
    Type: String

  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod

  LambdaExecutionRole:
    Type: String
    Description: ARN of the IAM role used by the Judge Lambda

  Schedule:
    Type: String
    Description: EventBridge schedule expression for the Judge Lambda

  LogRetentionDays:
    Type: Number
    Default: 7

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Evaluation Harness Lambda functions

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs in which Lambda network interfaces are created

  DatabaseEndpoint:
    Type: String

  DatabasePort:
    Type: String

  DatabaseName:
    Type: String

  DatabaseSecretArn:
    Type: String

Resources:
  JudgeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-${ProjectName}-judge"
      RetentionInDays: !Ref LogRetentionDays

  JudgeLambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - JudgeLogGroup
    Properties:
      FunctionName: !Sub "${Environment}-${ProjectName}-judge"
      Description: Judges and records the results of completed evaluation runs

      CodeUri: ../src
      Handler: judge.handler
      Runtime: nodejs24.x

      Architectures:
        - x86_64

      MemorySize: 512
      Timeout: 30
      Tracing: Active

      Role: !Ref LambdaExecutionRole

      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds

      Layers:
        - !Sub >-
          {{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}

      Environment:
        Variables:
          NODE_ENV: !Ref Environment
          PARAMETERS_SECRETS_EXTENSION_HTTP_PORT: '2773'
          PARAMETERS_SECRETS_EXTENSION_LOG_LEVEL: INFO
          SECRETS_MANAGER_TTL: '300'
          DB_HOST: !Ref DatabaseEndpoint
          DB_PORT: !Ref DatabasePort
          DB_NAME: !Ref DatabaseName
          DB_SECRET_ARN: !Ref DatabaseSecretArn

      Events:
        JudgeSchedule:
          Type: Schedule
          Properties:
            Name: !Sub "${Environment}-${ProjectName}-judge-schedule"
            Schedule: !Ref Schedule
            Description: Judges completed evaluation runs on a schedule
            Enabled: true

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - judge.ts
        Target: es2022
        Minify: true
        Sourcemap: true
        Loader:
          - .pem=text

Outputs:
  JudgeLambdaArn:
    Description: ARN of the Judge Lambda function
    Value: !GetAtt JudgeLambda.Arn

  JudgeLambdaName:
    Description: Name of the Judge Lambda function
    Value: !Ref JudgeLambda

  JudgeScheduleName:
    Description: Name of the Judge EventBridge schedule
    Value: !Sub "${Environment}-${ProjectName}-judge-schedule"

  JudgeLogGroupName:
    Description: CloudWatch Logs log group for the Judge Lambda
    Value: !Ref JudgeLogGroup