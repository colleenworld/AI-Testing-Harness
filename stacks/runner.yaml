AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Scheduled runner Lambda for the Evaluation Harness

Parameters:
  ProjectName:
    Type: String

  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod

  LambdaExecutionRole:
    Type: String
    Description: ARN of the IAM role used by the Runner Lambda

  Schedule:
    Type: String
    Description: EventBridge schedule expression for the Runner Lambda

  LogRetentionDays:
    Type: Number
    Default: 7

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Evaluation Harness Lambda functions

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs in which Lambda network interfaces are created

  DatabaseEndpoint:
    Type: String

  DatabasePort:
    Type: String

  DatabaseName:
    Type: String

  DatabaseSecretArn:
    Type: String

Resources:
  RunnerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-${ProjectName}-runner"
      RetentionInDays: !Ref LogRetentionDays

  RunnerLambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - RunnerLogGroup
    Properties:
      FunctionName: !Sub "${Environment}-${ProjectName}-runner"
      Description: Runs concurrent evaluation model batches on a schedule

      CodeUri: ../src
      Handler: runner.handler
      Runtime: nodejs24.x

      Architectures:
        - x86_64

      MemorySize: 512
      Timeout: 30
      Tracing: Active

      Role: !Ref LambdaExecutionRole

      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds

      Layers:
        - !Sub >-
          {{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}

      Environment:
        Variables:
          NODE_ENV: !Ref Environment
          PARAMETERS_SECRETS_EXTENSION_HTTP_PORT: '2773'
          PARAMETERS_SECRETS_EXTENSION_LOG_LEVEL: INFO
          SECRETS_MANAGER_TTL: '300'
          DB_HOST: !Ref DatabaseEndpoint
          DB_PORT: !Ref DatabasePort
          DB_NAME: !Ref DatabaseName
          DB_SECRET_ARN: !Ref DatabaseSecretArn

      Events:
        RunnerSchedule:
          Type: Schedule
          Properties:
            Name: !Sub "${Environment}-${ProjectName}-runner-schedule"
            Schedule: !Ref Schedule
            Description: Runs model evaluation batches after hydration
            Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - runner.ts
        Target: es2022
        Minify: true
        Sourcemap: true
        Loader:
         - .pem=text

Outputs:
  RunnerLambdaArn:
    Description: ARN of the Runner Lambda function
    Value: !GetAtt RunnerLambda.Arn

  RunnerLambdaName:
    Description: Name of the Runner Lambda function
    Value: !Ref RunnerLambda

  RunnerScheduleName:
    Description: Name of the Runner EventBridge schedule
    Value: !Sub "${Environment}-${ProjectName}-runner-schedule"

  RunnerLogGroupName:
    Description: CloudWatch Logs log group for the Runner Lambda
    Value: !Ref RunnerLogGroup