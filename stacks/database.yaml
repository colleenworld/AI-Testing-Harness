AWSTemplateFormatVersion: '2010-09-09'
Description: PostgreSQL database for the Evaluation Harness

Parameters:
  ProjectName:
    Type: String

  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod

  DbUsername:
    Type: String
    Default: evaladmin
    MinLength: 1
    MaxLength: 63
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9_]*'
    Description: PostgreSQL master username

  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group created for RDS by the network stack

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for the RDS subnet group

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:
  EvaluationDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}-rds-credentials"
      Description: Generated master credentials for RDS PostgreSQL instance
      GenerateSecretString:
        SecretStringTemplate: '{ "username": "evaladmin" }'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\` ()[]{}<>;:,.-=_+*&^%$#|~?'

  # Network access firewall controls
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound PostgreSQL traffic from Lambda functions
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  EvaluationDatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the Evaluation Harness database
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${ProjectName}-database-subnet-group"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  EvaluationDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: !Sub "${Environment}-${ProjectName}-postgres"

      Engine: postgres
      EngineVersion: '18'
      DBInstanceClass: db.t4g.micro

      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true

      DBName: !Sub "${ProjectName}${Environment}db"
      Port: 5432

      MasterUsername: !Ref DbUsername
      ManageMasterUserPassword: true

      DBSubnetGroupName: !Ref EvaluationDatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroupId

      PubliclyAccessible: false
      MultiAZ: !If [IsProduction, true, false]

      BackupRetentionPeriod: !If [IsProduction, 7, 1]
      DeleteAutomatedBackups: false
      CopyTagsToSnapshot: true

      DeletionProtection: !If [IsProduction, true, false]
      AutoMinorVersionUpgrade: true

      EnablePerformanceInsights: !If [IsProduction, true, false]
      PerformanceInsightsRetentionPeriod: !If
        - IsProduction
        - 7
        - !Ref AWS::NoValue

      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${ProjectName}-postgres"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  EvaluationDatabaseV2:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${Environment}-${ProjectName}-postgres-v2"

      Engine: postgres
      EngineVersion: '18'
      DBInstanceClass: db.t4g.micro

      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true

      DBName: !Sub "${ProjectName}${Environment}db"
      Port: 5432

      MasterUsername: !Ref DbUsername
      ManageMasterUserPassword: true

      DBSubnetGroupName: !Ref EvaluationDatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroupId

      PubliclyAccessible: false
      MultiAZ: !If [IsProduction, true, false]

      BackupRetentionPeriod: !If [IsProduction, 7, 1]
      DeleteAutomatedBackups: false
      CopyTagsToSnapshot: true

      DeletionProtection: !If [IsProduction, true, false]
      AutoMinorVersionUpgrade: true

      EnablePerformanceInsights: !If [IsProduction, true, false]
      PerformanceInsightsRetentionPeriod: !If
        - IsProduction
        - 7
        - !Ref AWS::NoValue

      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${ProjectName}-postgres-v2"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
Outputs:
  DatabaseEndpoint:
    Description: PostgreSQL database endpoint
    Value: !GetAtt EvaluationDatabaseV2.Endpoint.Address

  DatabasePort:
    Description: PostgreSQL database port
    Value: !GetAtt EvaluationDatabaseV2.Endpoint.Port

  DatabaseName:
    Description: PostgreSQL database name
    Value: !Sub "${ProjectName}${Environment}db"

  DatabaseSecretArn:
    Description: ARN of the RDS-managed master credential secret
    Value: !GetAtt EvaluationDatabaseV2.MasterUserSecret.SecretArn

  DatabaseInstanceIdentifier:
    Description: RDS database instance identifier
    Value: !Ref EvaluationDatabaseV2

  DatabaseSubnetGroupName:
    Description: RDS database subnet group
    Value: !Ref EvaluationDatabaseSubnetGroup