name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # or your default branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Add build steps here if your folder is generated (e.g., npm install && npm run build)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '../../web-dashboard' # 👈 Change this to your preferred directory

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4