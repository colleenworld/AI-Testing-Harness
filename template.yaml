AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Secure Production Evaluation Harness Engine Infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
  ProjectName:
    Type: String
    Default: evaluation

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs24.x
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        DB_USER: evaladmin
        DB_NAME: !Sub "${ProjectName}_${Environment}_db"
        DB_HOST: !GetAtt EvaluationDatabase.Endpoint.Address
        DB_PORT: '5432'
        TAVILY_API_KEY: !Join [ '', [ '{{resolve:secretsmanager:', !Ref ProjectName, '-keys/' ,!Ref Environment, '/SecretString:tavily}}' ] ]
        GEMINI_API_KEY: !Join [ '', [ '{{resolve:secretsmanager:', !Ref ProjectName, '-keys/' , !Ref Environment, '/SecretString:gemini}}' ] ]
        OPENROUTER_API_KEY: !Join [ '', [ '{{resolve:secretsmanager:', !Ref ProjectName, '-keys/' , !Ref Environment, '/SecretString:openrouter}}' ] ]
        OPENAI_API_KEY: !Join [ '', [ '{{resolve:secretsmanager:', !Ref ProjectName, '-keys/' , !Ref Environment, '/SecretString:openapi}}' ] ]
        DB_PASSWORD: !Join [ '', [ '{{resolve:secretsmanager:', !Ref ProjectName, '-keys/', !Ref Environment, '/SecretString:password}}' ] ]

Resources:
  # Secure storage block for automatic database password generation
  EvaluationDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}-${Environment}"
      Description: Generated master credentials for RDS PostgreSQL instance
      GenerateSecretString:
        SecretStringTemplate: '{ \"username\": \"dbadmin\" }'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\` ()[]{}<>;:,.-=_+*&^%$#|~?'

  # Network access firewall controls
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound PostgreSQL traffic from Lambda functions
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0 # Restrict this to your specific VPC CIDR block in production environments

  # Relational database instance storage block
  EvaluationDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: '20'
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      EngineVersion: '18'
      MasterUsername: evaladmin
      MasterUserPassword: !Join [ '', [ '{{resolve:secretsmanager:', !Ref ProjectName, '-keys/' ,!Ref Environment, 'SecretString:password}}' ] ]
      DBName: !Sub "${ProjectName}_${Environment}_db"
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      DeleteAutomatedBackups: true

  # 8. Decoupled Intermediary API Lambda attached to our REST Gateway
  # 8. Decoupled Intermediary API Lambda attached to our REST Gateway
  # Pipelines Lambdas Serverless Execution Definitions
  HydrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: hydrate.handler
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: true
        EntryPoints:
          - hydrate.ts

  RunnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: runner.handler
      Events:
        DailyInferenceRunnerSchedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(0 2 * * ? *)'
            Description: Trigger concurrent model batches daily at 2 AM UTC after hydration finishes
            Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: true
        EntryPoints:
          - runner.ts

  JudgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: judge.handler
      Events:
        DailyJudgeSchedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(30 2 * * ? *)'
            Description: Trigger metrics evaluation daily at 2:30 AM UTC
            Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: true
        EntryPoints:
          - judge.ts

  # Decoupled Intermediary API Lambda attached to our REST Gateway
  ApiHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: apiHandler.handler
      Events:
        GetEvaluationsApi:
          Type: Api
          Properties:
            Path: /v1/evaluations
            Method: GET
            RestApiId: !Ref EvaluationApiGateway
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: true
        EntryPoints:
          - apiHandler.ts

  EvaluationApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      ApiKeySourceType: HEADER # Instructs the edge to parse keys from the 'x-api-key' header
      Auth:
        ApiKeyRequired: true # Enforces global API key restriction across all routes natively
      Cors:
        AllowOrigin: "'http://localhost:3000'"
        AllowHeaders: "'Content-Type,X-Api-Key'"
        AllowMethods: "'GET,POST,OPTIONS'"

    # 2. FIXED: Creates a secure API Key asset token inside API Gateway
  EvaluationApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api-key"
      Enabled: true
      GenerateDistinctId: true

    # 3. FIXED: Links your generated API Key to an active usage billing plan
  EvaluationUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub "${ProjectName}-${Environment}-usage-plan"
      Description: Global throttle limits and key assignments for frontend dashboard access
      ApiStages:
        - ApiId: !Ref EvaluationApiGateway
          Stage: !Ref Environment

    # 4. FIXED: Binds the API Key token to the usage plan framework
  EvaluationUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref EvaluationApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref EvaluationUsagePlan

Outputs:
  ApiEndpointUrl:
    Description: Secured HTTP API Execution entry path point
    Value: !Sub "https://${EvaluationApiGateway}.execute-api.${AWS::Region}://{Environment}"
