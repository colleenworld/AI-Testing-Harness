services:
  local-postgres:
    image: postgres:15-alpine
    container_name: local_eval_db
    environment:
      POSTGRES_USER: eval_admin
      POSTGRES_PASSWORD: local_secure_password_123
      POSTGRES_DB: llm_evals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: local_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eval.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - local-postgres

volumes:
  pgdata: